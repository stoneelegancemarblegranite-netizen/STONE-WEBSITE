<style>
/* Cross-document page transitions — same opt-in as the rest of the site. */
@view-transition{navigation:auto}
::view-transition-old(root){animation:pageOut .26s cubic-bezier(.4,0,1,1) both;mix-blend-mode:normal}
::view-transition-new(root){animation:pageIn .44s cubic-bezier(.22,.61,.36,1) both;mix-blend-mode:normal}
@keyframes pageOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px)}}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
::view-transition-old(root),::view-transition-new(root){animation-duration:.001ms}
}
:root{
  --paper:#FAF9F7; --paper-2:#F4F2EE; --line:rgba(18,18,18,.12);
  --ink:#121212; --ink-soft:rgba(23,17,14,.72); --ink-mute:#57564E;
  --moss:#4E5738; --moss-lift:#63704A; --gold:#8A5F18; --gold-soft:#C8912F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);
  font:400 16px/1.7 Archivo,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px}

main{flex:1;display:flex;align-items:center;justify-content:center;
  padding:clamp(28px,7vw,64px) 20px}

.card{width:100%;max-width:420px;background:#FFF;border:1px solid var(--line);
  padding:clamp(28px,6vw,44px) clamp(22px,5vw,36px) clamp(24px,5vw,34px);
  box-shadow:0 24px 60px rgba(18,18,18,.07)}

/* Head ------------------------------------------------------------------ */
.brand{padding-bottom:26px;border-bottom:1px solid var(--line)}
.brand a{display:block}
.brand img{width:min(240px,80%);height:auto;margin-inline:auto}

/* Buttons --------------------------------------------------------------- */
.links{display:grid;gap:10px;margin-top:26px}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px;
  border:1px solid var(--line);background:var(--paper);
  transition:background .3s,border-color .3s,transform .3s}
.row:hover{background:var(--paper-2);border-color:rgba(18,18,18,.24);
  transform:translateY(-1px)}
.row svg{width:19px;height:19px;flex:0 0 auto;stroke:var(--gold);
  stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row b{display:block;font-family:Montserrat,system-ui,sans-serif;
  font-size:10px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;
  color:var(--ink-mute);margin-bottom:3px}
.row span{display:block;font-size:15px;line-height:1.35;word-break:break-word}
.row .go{margin-left:auto;font-size:15px;color:var(--ink-mute);
  transition:transform .3s,color .3s}
.row:hover .go{transform:translateX(3px);color:var(--gold)}

.row.primary{background:var(--moss);border-color:var(--moss);color:#F4F2EE}
.row.primary:hover{background:var(--moss-lift);border-color:var(--moss-lift)}
.row.primary svg{stroke:#E2B866}
.row.primary b{color:rgba(244,242,238,.66)}
.row.primary .go{color:rgba(244,242,238,.7)}
.row.primary:hover .go{color:#E2B866}

.row.dark{background:#0D0D0D;border-color:#0D0D0D;color:#F4F2EE}
.row.dark:hover{background:#1C1C1C;border-color:#1C1C1C}
.row.dark svg{stroke:#E2B866}
.row.dark b{color:rgba(244,242,238,.6)}
.row.dark .go{color:rgba(244,242,238,.7)}

/* Social ---------------------------------------------------------------- */
.social{display:flex;justify-content:center;gap:12px;margin-top:22px;
  padding-top:22px;border-top:1px solid var(--line)}
.social a{display:grid;place-items:center;width:46px;height:46px;
  border:1px solid var(--line);background:var(--paper);
  transition:background .3s,border-color .3s,transform .3s}
.social a:hover{background:var(--moss);border-color:var(--moss);transform:translateY(-2px)}
.social svg{width:19px;height:19px;stroke:var(--ink);stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.social a:hover svg{stroke:#E2B866}

/* Foot ------------------------------------------------------------------ */
.note{margin:24px 0 0;text-align:center;font-size:12px;line-height:1.8;
  color:var(--ink-mute)}
.note a{color:var(--gold);border-bottom:1px solid rgba(138,95,24,.3)}
.note a:hover{border-color:var(--gold)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
